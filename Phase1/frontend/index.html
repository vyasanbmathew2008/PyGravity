<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyGravity</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⚡ PyGravity</div>
    <div class="project">Phase 1 — Basic IDE</div>
  </header>

  <main class="workspace">
    <aside class="explorer">
      <h2>EXPLORER</h2>
      <div id="file-tree">Workspace</div>
    </aside>

    <section class="editor-panel">
      <div class="tabs">
        <div class="tab active">Welcome</div>
      </div>
      <div id="editor" class="editor">
        <h1>Welcome to PyGravity</h1>
        <p>Phase 1 basic IDE foundation.</p>
      </div>
    </section>

    <aside class="ai-panel">
      <h2>AI</h2>
      <p>OpenRouter integration will be added in a later phase.</p>
    </aside>
  </main>

  <footer class="statusbar">
    <span>PyGravity</span>
    <span>Phase 1</span>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
